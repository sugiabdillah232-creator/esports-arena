<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kalkulator Upah Lembur</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body class="bg-slate-100 min-h-screen p-4">

  <div class="max-w-4xl mx-auto">

    <!-- HEADER -->
    <div class="bg-indigo-700 text-white rounded-3xl shadow-2xl overflow-hidden">

      <div class="p-8 text-center">

        <div class="flex justify-center mb-3">
          <div class="bg-white/20 p-4 rounded-full">
            <i data-lucide="calculator"></i>
          </div>
        </div>

        <h1 class="text-3x3 font-bold">
          Kalkulator Upah Lembur
        </h1>

        <p class="text-indigo-200 mt-2">
          Sistem Perhitungan PP No.35 Tahun 2021
        </p>

      </div>

    </div>


    <!-- FORM -->
    <div class="bg-white rounded-3xl shadow-xl mt-6 p-6">

      <div class="grid md:grid-cols-2 gap-5">

        <div>
          <label class="font-semibold block mb-2">Tanggal</label>
          <input
            type="date"
            id="tanggal"
            class="w-full border rounded-xl p-3"
          />
        </div>

        <div>
          <label class="font-semibold block mb-2">Nama Karyawan</label>
          <input
            type="text"
            id="nama"
            placeholder="Masukkan nama"
            class="w-full border rounded-xl p-3"
          />
        </div>

        <div>
          <label class="font-semibold block mb-2">Gaji Bulanan</label>
          <input
            type="number"
            id="gaji"
            placeholder="5000000"
            class="w-full border rounded-xl p-3"
          />
        </div>

        <div>
          <label class="font-semibold block mb-2">Jenis Hari</label>

          <select
            id="jenisHari"
            class="w-full border rounded-xl p-3"
          >
            <option value="kerja">Hari Kerja</option>
            <option value="libur">Hari Libur</option>
          </select>
        </div>

      </div>


      <!-- SLIDER -->
      <div class="mt-6">

        <label class="font-semibold block mb-3">
          Jam Lembur
        </label>

        <input
          type="range"
          id="jam"
          min="1"
          max="24"
          value="1"
          class="w-full"
        />

        <div class="text-center mt-3 text-2xl font-bold text-indigo-700">
          <span id="jamText">1</span> Jam
        </div>

      </div>


      <!-- HASIL -->
      <div class="bg-slate-50 border rounded-2xl p-5 mt-6 space-y-4">

        <div class="flex justify-between">
          <span>Upah per Jam</span>
          <span id="upahPerJam">Rp 0</span>
        </div>

        <div class="flex justify-between">
          <span>Konversi Lembur</span>
          <span id="konversiJam">0</span>
        </div>

        <div class="flex justify-between">
          <span>Total Jam Bulanan</span>
          <span id="totalJamBulanan">0 Jam</span>
        </div>

        <hr>

        <div class="flex justify-between text-2xl font-bold text-green-600">
          <span>Total Upah</span>
          <span id="total">Rp 0</span>
        </div>

      </div>


      <!-- BUTTON -->
      <div class="grid md:grid-cols-3 gap-3 mt-6">

        <button
          onclick="simpanLembur()"
          class="bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl font-bold"
        >
          Simpan
        </button>

        <button
          onclick="downloadPDF()"
          class="bg-green-600 hover:bg-green-700 text-white py-3 rounded-xl font-bold"
        >
          Download PDF
        </button>

        <button
          onclick="hapusData()"
          class="bg-red-600 hover:bg-red-700 text-white py-3 rounded-xl font-bold"
        >
          Hapus Data
        </button>

      </div>

    </div>


    <!-- REKAP -->
    <div class="bg-white rounded-3xl shadow-xl mt-6 p-6 overflow-auto">

      <h2 class="text-2xl font-bold mb-5">
        Rekap Lembur Bulanan
      </h2>

      <table class="w-full border-collapse">

        <thead>
          <tr class="bg-slate-100">
            <th class="border p-3">Tanggal</th>
            <th class="border p-3">Nama</th>
            <th class="border p-3">Jam</th>
            <th class="border p-3">Jenis</th>
            <th class="border p-3">Total</th>
          </tr>
        </thead>

        <tbody id="tabelLembur"></tbody>

      </table>


      <div class="text-right text-3xl font-bold text-indigo-700 mt-5">
        Grand Total:
        <span id="grandTotal">Rp 0</span>
      </div>

    </div>


    <footer class="text-center text-slate-500 text-sm py-6">
      © 2026 Sugiproduction.com — All Rights Reserved
    </footer>

  </div>


  <script>

    lucide.createIcons();

    const slider = document.getElementById("jam");
    const jamText = document.getElementById("jamText");

    slider.addEventListener("input", () => {
      jamText.innerText = slider.value;
      hitungPreview();
    });


    function rupiah(angka) {
      return "Rp " + Math.round(angka).toLocaleString("id-ID");
    }


    function hitungLembur(gaji, jenisHari, jam) {

      const upahPerJam = gaji / 173;

      let konversi = 0;

      if (jenisHari === "kerja") {

        if (jam >= 1) {
          konversi += 1.5;
        }

        if (jam > 1) {
          konversi += (jam - 1) * 2;
        }

      } else {

        for (let i = 1; i <= jam; i++) {

          if (i <= 8) {
            konversi += 2;
          }
          else if (i === 9) {
            konversi += 3;
          }
          else {
            konversi += 4;
          }

        }

      }

      const total = upahPerJam * konversi;

      return {
        upahPerJam,
        konversi,
        total
      };

    }


    function hitungPreview() {

      const gaji = parseFloat(document.getElementById("gaji").value) || 0;
      const jenisHari = document.getElementById("jenisHari").value;
      const jam = parseInt(document.getElementById("jam").value);

      const hasil = hitungLembur(gaji, jenisHari, jam);

      document.getElementById("upahPerJam").innerText = rupiah(hasil.upahPerJam);
      document.getElementById("konversiJam").innerText = hasil.konversi + " Jam Upah";
      document.getElementById("total").innerText = rupiah(hasil.total);

    }


    function simpanLembur() {

      const tanggal = document.getElementById("tanggal").value;
      const nama = document.getElementById("nama").value;
      const gaji = parseFloat(document.getElementById("gaji").value);
      const jenisHari = document.getElementById("jenisHari").value;
      const jam = parseInt(document.getElementById("jam").value);

      if (!tanggal || !nama || !gaji) {
        alert("Lengkapi data terlebih dahulu");
        return;
      }

      const hasil = hitungLembur(gaji, jenisHari, jam);

      const data = {
        tanggal,
        nama,
        jam,
        jenisHari,
        total: hasil.total
      };

      let daftar = JSON.parse(localStorage.getItem("lembur")) || [];

      daftar.push(data);

      localStorage.setItem("lembur", JSON.stringify(daftar));

      tampilkanData();

      alert("Data lembur berhasil disimpan");

    }


    function tampilkanData() {

      const tabel = document.getElementById("tabelLembur");

      tabel.innerHTML = "";

      let daftar = JSON.parse(localStorage.getItem("lembur")) || [];

      let grandTotal = 0;
      let totalJam = 0;

      daftar.forEach(item => {

        grandTotal += item.total;
        totalJam += item.jam;

        tabel.innerHTML += `
          <tr>
            <td class="border p-3">${item.tanggal}</td>
            <td class="border p-3">${item.nama}</td>
            <td class="border p-3 text-center">${item.jam}</td>
            <td class="border p-3">${item.jenisHari}</td>
            <td class="border p-3">${rupiah(item.total)}</td>
          </tr>
        `;

      });

      document.getElementById("grandTotal").innerText = rupiah(grandTotal);
      document.getElementById("totalJamBulanan").innerText = totalJam + " Jam";

    }


    function hapusData() {

      if (confirm("Hapus semua data lembur?")) {

        localStorage.removeItem("lembur");

        tampilkanData();

      }

    }


    async function downloadPDF() {

  const { jsPDF } = window.jspdf;

  const doc = new jsPDF();

  let daftar = JSON.parse(localStorage.getItem("lembur")) || [];

  let grandTotal = 0;

  doc.setFontSize(18);
  doc.text("Slip Rekap Lembur", 20, 20);

  doc.setFontSize(12);

  let y = 40;

  daftar.forEach((item, index) => {

    grandTotal += item.total;

    doc.text(
      `${index + 1}. ${item.tanggal} | ${item.nama} | ${item.jam} Jam | ${item.jenisHari} | ${rupiah(item.total)}`,
      20,
      y
    );

    y += 10;

  });

  // Garis
  doc.line(20, y, 190, y);

  y += 15;

  // Grand Total
  doc.setFontSize(16);

  doc.text(
    `Grand Total : ${rupiah(grandTotal)}`,
    20,
    y
  );

  // Nama file
  const pdfBlob = doc.output("blob");

  const link = document.createElement("a");

  link.href = URL.createObjectURL(pdfBlob);

  link.download = "Slip-Lembur.pdf";

  link.click();

}


    document.getElementById("gaji").addEventListener("input", hitungPreview);
    document.getElementById("jenisHari").addEventListener("change", hitungPreview);

    hitungPreview();
    tampilkanData();

  </script>

</body>
</html>
