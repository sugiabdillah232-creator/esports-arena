<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kalkulator Upah Lembur Pro V2</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    body {
      font-family: sans-serif;
    }
  </style>
</head>

<body class="bg-slate-100 min-h-screen text-slate-800">

<div id="auth-screen" class="flex min-h-screen items-center justify-center p-4">

  <div class="bg-white w-full max-w-md rounded-3xl shadow-xl p-8 space-y-6">

    <div class="text-center space-y-2">
      <div class="flex justify-center">
        <div class="bg-indigo-600 text-white p-3 rounded-2xl">
          <i data-lucide="calculator"></i>
        </div>
      </div>

      <h1 class="text-2xl font-bold">Kalkulator Lembur Pro</h1>
      <p class="text-sm text-slate-500">Multi User System</p>
    </div>

    <div class="border rounded-2xl p-5 space-y-4">

      <h2 class="font-bold">Daftar Pengguna Baru</h2>

      <input
        type="text"
        id="setup-username"
        placeholder="Username baru"
        class="w-full border rounded-xl p-3"
      />

      <input
        type="password"
        id="setup-pin"
        maxlength="6"
        placeholder="PIN 6 digit"
        class="w-full border rounded-xl p-3"
      />

      <input
        type="password"
        id="confirm-pin"
        maxlength="6"
        placeholder="Konfirmasi PIN"
        class="w-full border rounded-xl p-3"
      />
    </div>

    <div class="border rounded-2xl p-5 space-y-4 bg-indigo-50">

      <h2 class="font-bold">Login Pengguna</h2>

      <input
        type="text"
        id="login-username"
        placeholder="Username"
        class="w-full border rounded-xl p-3"
      />

      <input
        type="password"
        id="login-pin"
        maxlength="6"
        placeholder="PIN"
        class="w-full border rounded-xl p-3"
      />
    </div>

    <button
      onclick="prosesAksiLanjut()"
      class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl font-bold"
    >
      Masuk
    </button>

  </div>
</div>

<div id="dashboard-screen" class="hidden">

  <nav class="bg-white border-b px-6 py-4 flex justify-between items-center">

    <div>
      <h1 class="font-bold text-xl">Dashboard Lembur</h1>
      <p class="text-xs text-slate-500">Sistem Rekap Lembur</p>
    </div>

    <div class="flex items-center gap-4">
      <span id="user-name" class="font-semibold"></span>

      <button
        onclick="logoutAplikasi()"
        class="bg-red-100 text-red-600 px-4 py-2 rounded-xl text-sm"
      >
        Logout
      </button>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto p-6 grid md:grid-cols-3 gap-6">

    <div class="bg-white rounded-2xl shadow-sm p-6 space-y-4">

      <h2 class="font-bold text-lg">Input Data</h2>

      <input
        type="date"
        id="tanggal"
        class="w-full border rounded-xl p-3"
      />

      <input
        type="text"
        id="nama"
        readonly
        class="w-full border rounded-xl p-3 bg-slate-100"
      />

      <input
        type="number"
        id="gaji"
        placeholder="Gaji bulanan"
        class="w-full border rounded-xl p-3"
      />

      <select
        id="jenisHari"
        class="w-full border rounded-xl p-3"
      >
        <option value="kerja">Hari Kerja</option>
        <option value="libur">Hari Libur</option>
      </select>

      <div>
        <div class="flex justify-between mb-2">
          <span>Jam Lembur</span>
          <span id="jamText">1</span>
        </div>

        <input
          type="range"
          id="jam"
          min="1"
          max="4"
          value="1"
          class="w-full"
        />
      </div>

      <button
        onclick="simpanLembur()"
        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl"
      >
        Simpan Data
      </button>

      <button
        onclick="downloadPDF()"
        class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl"
      >
        Download PDF
      </button>

      <button
        onclick="hapusData()"
        class="w-full bg-rose-100 text-rose-600 py-3 rounded-xl"
      >
        Hapus Data
      </button>
    </div>

    <div class="md:col-span-2 space-y-6">

      <div class="bg-indigo-950 text-white rounded-2xl p-6">

        <p class="text-sm text-indigo-300">Total Upah</p>

        <h2 id="total" class="text-4xl font-bold mt-2">
          Rp 0
        </h2>

        <div class="grid grid-cols-3 gap-4 mt-6 text-sm">
          <div>
            <p>Upah/Jam</p>
            <h3 id="upahPerJam">Rp 0</h3>
          </div>

          <div>
            <p>Konversi</p>
            <h3 id="konversiJam">0</h3>
          </div>

          <div>
            <p>Total Jam</p>
            <h3 id="totalJamBulanan">0 Jam</h3>
          </div>
        </div>
      </div>

      <div class="bg-white rounded-2xl p-6 shadow-sm overflow-x-auto">

        <div class="flex justify-between items-center mb-4">
          <h2 class="font-bold text-lg">Rekap Data</h2>

          <div>
            Grand Total:
            <span id="grandTotal" class="font-bold text-indigo-700">
              Rp 0
            </span>
          </div>
        </div>

        <table class="w-full text-sm">
          <thead>
            <tr class="bg-slate-100">
              <th class="p-3">Tanggal</th>
              <th class="p-3">Nama</th>
              <th class="p-3">Jam</th>
              <th class="p-3">Jenis Hari</th>
              <th class="p-3 text-right">Upah</th>
            </tr>
          </thead>

          <tbody id="tabelLembur"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script>

lucide.createIcons();

function prosesAksiLanjut() {

  const setupUsername = document.getElementById("setup-username").value.trim();
  const setupPin = document.getElementById("setup-pin").value;
  const confirmPin = document.getElementById("confirm-pin").value;

  const loginUsername = document.getElementById("login-username").value.trim();
  const loginPin = document.getElementById("login-pin").value;

  let users = JSON.parse(localStorage.getItem("users")) || [];

  // REGISTER
  if (setupUsername && setupPin.length === 6 && confirmPin.length === 6) {

    if (setupPin !== confirmPin) {
      alert("PIN tidak cocok!");
      return;
    }

    const userExist = users.find(u => u.username === setupUsername);

    if (userExist) {
      alert("Username sudah digunakan!");
      return;
    }

    users.push({
      username: setupUsername,
      pin: setupPin
    });

    localStorage.setItem("users", JSON.stringify(users));

    localStorage.setItem("user_aktif_nama", setupUsername);

    cekStatusLogin();

    alert("Pendaftaran berhasil!");

    return;
  }

  // LOGIN
  if (loginUsername && loginPin.length === 6) {

    const user = users.find(
      u => u.username === loginUsername && u.pin === loginPin
    );

    if (!user) {
      alert("Username atau PIN salah!");
      return;
    }

    localStorage.setItem("user_aktif_nama", user.username);

    cekStatusLogin();

    return;
  }

  alert("Lengkapi data login atau pendaftaran!");
}

function cekStatusLogin() {

  const userNama = localStorage.getItem("user_aktif_nama");

  if (userNama) {

    document.getElementById("auth-screen").classList.add("hidden");

    document.getElementById("dashboard-screen").classList.remove("hidden");

    document.getElementById("user-name").innerText = userNama;

    document.getElementById("nama").value = userNama;

    tampilkanData();
  }
}

function logoutAplikasi() {

  localStorage.removeItem("user_aktif_nama");

  location.reload();
}

window.onload = () => {
  cekStatusLogin();
};

const slider = document.getElementById("jam");
const jamText = document.getElementById("jamText");

slider.addEventListener("input", () => {

  jamText.innerText = slider.value;

  hitungPreview();
});

function rupiah(angka) {
  return "Rp " + Math.round(angka).toLocaleString("id-ID");
}

function hitungLembur(gaji, jenisHari, jam) {

  const upahPerJam = gaji / 173;

  let konversi = 0;

  if (jenisHari === "kerja") {

    if (jam >= 1) konversi += 1.5;

    if (jam > 1) {
      konversi += (jam - 1) * 2;
    }

  } else {

    for (let i = 1; i <= jam; i++) {

      if (i <= 8) konversi += 2;
      else if (i === 9) konversi += 3;
      else konversi += 4;
    }
  }

  return {
    upahPerJam,
    konversi,
    total: upahPerJam * konversi
  };
}

function hitungPreview() {

  const gaji = parseFloat(document.getElementById("gaji").value) || 0;

  const jenisHari = document.getElementById("jenisHari").value;

  const jam = parseInt(slider.value);

  const hasil = hitungLembur(gaji, jenisHari, jam);

  document.getElementById("upahPerJam").innerText = rupiah(hasil.upahPerJam);

  document.getElementById("konversiJam").innerText = hasil.konversi + " Jam Upah";

  document.getElementById("total").innerText = rupiah(hasil.total);
}

function simpanLembur() {

  const tanggal = document.getElementById("tanggal").value;

  const nama = document.getElementById("nama").value.trim();

  const gaji = parseFloat(document.getElementById("gaji").value);

  const jenisHari = document.getElementById("jenisHari").value;

  const jam = parseInt(slider.value);

  if (!tanggal || !nama || !gaji) {
    alert("Lengkapi data!");
    return;
  }

  if (gaji <= 0) {
    alert("Gaji tidak valid!");
    return;
  }

  const hasil = hitungLembur(gaji, jenisHari, jam);

  const data = {
    tanggal,
    nama,
    jam,
    jenisHari: jenisHari === "kerja" ? "Hari Kerja" : "Hari Libur",
    total: hasil.total
  };

  const key = `lembur_${nama}`;

  let daftar = JSON.parse(localStorage.getItem(key)) || [];

  daftar.push(data);

  localStorage.setItem(key, JSON.stringify(daftar));

  tampilkanData();

  alert("Data berhasil disimpan!");
}

function tampilkanData() {

  const namaAktif = localStorage.getItem("user_aktif_nama");

  const key = `lembur_${namaAktif}`;

  let daftar = JSON.parse(localStorage.getItem(key)) || [];

  daftar.sort((a, b) => new Date(b.tanggal) - new Date(a.tanggal));

  const tabel = document.getElementById("tabelLembur");

  tabel.innerHTML = "";

  let grandTotal = 0;
  let totalJam = 0;

  daftar.forEach(item => {

    grandTotal += item.total;
    totalJam += item.jam;

    tabel.innerHTML += `
      <tr class="border-b hover:bg-slate-50">
        <td class="p-3">${item.tanggal}</td>
        <td class="p-3">${item.nama}</td>
        <td class="p-3">${item.jam} Jam</td>
        <td class="p-3">${item.jenisHari}</td>
        <td class="p-3 text-right">${rupiah(item.total)}</td>
      </tr>
    `;
  });

  document.getElementById("grandTotal").innerText = rupiah(grandTotal);

  document.getElementById("totalJamBulanan").innerText = totalJam + " Jam";
}

function hapusData() {

  const namaAktif = localStorage.getItem("user_aktif_nama");

  if (confirm("Hapus semua data?")) {

    localStorage.removeItem(`lembur_${namaAktif}`);

    tampilkanData();
  }
}

function downloadPDF() {

  const { jsPDF } = window.jspdf;

  const doc = new jsPDF();

  const namaAktif = localStorage.getItem("user_aktif_nama");

  const key = `lembur_${namaAktif}`;

  let daftar = JSON.parse(localStorage.getItem(key)) || [];

  if (daftar.length === 0) {
    alert("Tidak ada data!");
    return;
  }

  let grandTotal = 0;

  // HEADER
  doc.setFont("helvetica", "bold");
  doc.setFontSize(18);
  doc.text("REKAPITULASI UPAH LEMBUR", 20, 20);

  doc.setFontSize(11);
  doc.setFont("helvetica", "normal");
  doc.text(`Nama Pengguna : ${namaAktif}`, 20, 30);
  doc.text(`Tanggal Cetak : ${new Date().toLocaleDateString('id-ID')}`, 20, 37);

  doc.line(20, 42, 190, 42);

  // TABLE HEADER
  let y = 52;

  doc.setFont("helvetica", "bold");
  doc.setFontSize(10);

  doc.text("No", 20, y);
  doc.text("Tanggal", 32, y);
  doc.text("Jam", 80, y);
  doc.text("Jenis Hari", 105, y);
  doc.text("Total Upah", 155, y);

  y += 10;

  doc.setFont("helvetica", "normal");

  daftar.forEach((item, index) => {

    grandTotal += item.total;

    // AUTO PAGE BREAK
    if (y > 270) {
      doc.addPage();
      y = 20;
    }

    doc.text(`${index + 1}`, 20, y);
    doc.text(`${item.tanggal}`, 32, y);
    doc.text(`${item.jam} Jam`, 80, y);
    doc.text(`${item.jenisHari}`, 105, y);
    doc.text(`${rupiah(item.total)}`, 155, y);

    y += 10;
  });

  // GARIS PEMBATAS
  doc.line(20, y, 190, y);

  y += 12;

  // GRAND TOTAL
  doc.setFont("helvetica", "bold");
  doc.setFontSize(13);

  doc.text(`GRAND TOTAL : ${rupiah(grandTotal)}`, 20, y);

  // FOOTER
  y += 20;

  doc.setFontSize(10);
  doc.setFont("helvetica", "normal");

  doc.text("Generated by sugiproduction.com", 20, y + 7);

  doc.save("Rekap-Lembur.pdf");
}

// SLIDER OTOMATIS

document.getElementById("jenisHari").addEventListener("change", () => {

  const jenisHari = document.getElementById("jenisHari").value;

  if (jenisHari === "kerja") {
    slider.max = 4;
  } else {
    slider.max = 16;
  }

  if (parseInt(slider.value) > parseInt(slider.max)) {

    slider.value = slider.max;

    jamText.innerText = slider.max;
  }

  hitungPreview();
});

</script>

</body>
</html>
