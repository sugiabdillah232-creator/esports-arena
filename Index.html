<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kalkulator Lembur</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- jsPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body class="bg-slate-100 min-h-screen p-4">

  <div class="max-w-3xl mx-auto">

    <div class="bg-white rounded-2xl shadow-xl overflow-hidden">

      <div class="bg-indigo-700 text-white p-6 text-center">
        <h1 class="text-2xl font-bold flex justify-center items-center gap-2">
          <i data-lucide="calculator"></i>
          Kalkulator Upah Lembur
        </h1>

        <p class="text-indigo-200 mt-2">
         Berdasarkan Aturan PP No.35 Tahun 2021 ( UU Cipta Kerja  )
        </p>
      </div>

      <div class="p-6 space-y-5">

        <div>
          <label class="font-semibold block mb-2">Tanggal</label>
          <input
            type="date"
            id="tanggal"
            class="w-full border rounded-lg p-3"
          />
        </div>

        <div>
          <label class="font-semibold block mb-2">Nama Karyawan</label>
          <input
            type="text"
            id="nama"
            placeholder="Masukkan nama"
            class="w-full border rounded-lg p-3"
          />
        </div>

        <div>
          <label class="font-semibold block mb-2">Gaji Bulanan</label>
          <input
            type="number"
            id="gaji"
            value="0"
            class="w-full border rounded-lg p-3"
          />
        </div>

        <div>
          <label class="font-semibold block mb-2">Jenis Hari</label>

          <select
            id="jenisHari"
            class="w-full border rounded-lg p-3"
          >
            <option value="kerja">Hari Kerja</option>
            <option value="libur">Hari Libur</option>
          </select>
        </div>

        <div>
          <label class="font-semibold block mb-2">Jam Lembur</label>

          <input
            type="range"
            id="jam"
            min="1"
            max="24"
            value="1"
            class="w-full"
          />

          <div class="text-center text-indigo-700 font-bold mt-2">
            <span id="jamText">1</span> Jam
          </div>
        </div>

        <button
          onclick="simpanLembur()"
          class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-lg font-bold"
        >
          Simpan Lembur
        </button>

        <div class="bg-slate-50 rounded-xl p-5 border">

          <div class="flex justify-between mb-3">
            <span>Upah per Jam</span>
            <span id="upahPerJam">Rp 0</span>
          </div>

          <div class="flex justify-between mb-3">
            <span>Konversi Jam</span>
            <span id="konversiJam">0</span>
          </div>

          <hr class="my-3">

          <div class="flex justify-between text-xl font-bold text-green-600">
            <span>Total</span>
            <span id="total">Rp 0</span>
          </div>

        </div>

      </div>

    </div>

    <!-- Rekap -->
    <div class="bg-white rounded-2xl shadow-xl mt-6 p-6">

      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-bold">Rekap Lembur Bulanan</h2>

        <button
          onclick="downloadPDF()"
          class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg"
        >
          Download PDF
        </button>
      </div>

      <div class="overflow-auto">

        <table class="w-full border-collapse">

          <thead>
            <tr class="bg-slate-100">
              <th class="border p-2">Tanggal</th>
              <th class="border p-2">Jam</th>
              <th class="border p-2">Jenis</th>
              <th class="border p-2">Upah</th>
            </tr>
          </thead>

          <tbody id="tabelLembur"></tbody>

        </table>

      </div>

      <div class="mt-5 text-right text-2xl font-bold text-indigo-700">
        Total Bulanan:
        <span id="grandTotal">Rp 0</span>
      </div>

    </div>

    <footer class="text-center text-sm text-slate-500 py-4">
      © 2026 Sugiproduction.com — All Rights Reserved
    </footer>

  </div>

  <script>

    lucide.createIcons();

    const slider = document.getElementById("jam");
    const jamText = document.getElementById("jamText");

    slider.addEventListener("input", () => {
      jamText.innerText = slider.value;
      hitungPreview();
    });

    function rupiah(angka) {
      return "Rp " + Math.round(angka).toLocaleString("id-ID");
    }

    function hitungLembur(gaji, jenisHari, jam) {

      const upahPerJam = gaji / 173;

      let konversi = 0;

      if (jenisHari === "kerja") {

        if (jam >= 1) {
          konversi += 1.5;
        }

        if (jam > 1) {
          konversi += (jam - 1) * 2;
        }

      } else {

        for (let i = 1; i <= jam; i++) {

          if (i <= 8) {
            konversi += 2;
          }
          else if (i === 9) {
            konversi += 3;
          }
          else {
            konversi += 4;
          }

        }

      }

      const total = upahPerJam * konversi;

      return {
        upahPerJam,
        konversi,
        total
      };
    }

    function hitungPreview() {

      const gaji = parseFloat(document.getElementById("gaji").value) || 0;
      const jenisHari = document.getElementById("jenisHari").value;
      const jam = parseInt(document.getElementById("jam").value);

      const hasil = hitungLembur(gaji, jenisHari, jam);

      document.getElementById("upahPerJam").innerText = rupiah(hasil.upahPerJam);
      document.getElementById("konversiJam").innerText = hasil.konversi + " Jam Upah";
      document.getElementById("total").innerText = rupiah(hasil.total);

    }

    function simpanLembur() {

      const tanggal = document.getElementById("tanggal").value;
      const nama = document.getElementById("nama").value;
      const gaji = parseFloat(document.getElementById("gaji").value);
      const jenisHari = document.getElementById("jenisHari").value;
      const jam = parseInt(document.getElementById("jam").value);

      const hasil = hitungLembur(gaji, jenisHari, jam);

      const data = {
        tanggal,
        nama,
        jam,
        jenisHari,
        total: hasil.total
      };

      let daftar = JSON.parse(localStorage.getItem("lembur")) || [];

      daftar.push(data);

      localStorage.setItem("lembur", JSON.stringify(daftar));

      tampilkanData();

      alert("Data lembur berhasil disimpan");

    }

    function tampilkanData() {

      const tabel = document.getElementById("tabelLembur");

      tabel.innerHTML = "";

      let daftar = JSON.parse(localStorage.getItem("lembur")) || [];

      let grandTotal = 0;

      daftar.forEach(item => {

        grandTotal += item.total;

        tabel.innerHTML += `
          <tr>
            <td class="border p-2">${item.tanggal}</td>
            <td class="border p-2 text-center">${item.jam}</td>
            <td class="border p-2">${item.jenisHari}</td>
            <td class="border p-2">${rupiah(item.total)}</td>
          </tr>
        `;

      });

      document.getElementById("grandTotal").innerText = rupiah(grandTotal);

    }

    async function downloadPDF() {

      const { jsPDF } = window.jspdf;

      const doc = new jsPDF();

      let daftar = JSON.parse(localStorage.getItem("lembur")) || [];

      doc.setFontSize(18);
      doc.text("Slip Rekap Lembur", 20, 20);

      let y = 40;

      daftar.forEach((item, index) => {

        doc.text(
          `${index + 1}. ${item.tanggal} | ${item.jam} Jam | ${item.jenisHari} | ${rupiah(item.total)}`,
          20,
          y
        );

        y += 10;

      });

      doc.save("slip-lembur.pdf");

    }

    hitungPreview();
    tampilkanData();

  </script>

</body>
</html>
