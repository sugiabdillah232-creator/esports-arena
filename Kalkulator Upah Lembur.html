<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Upah Lembur Sesuai PP No. 35 Tahun 2021</title>
    <!-- Tailwind CSS untuk tampilan modern -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-2xl rounded-2xl shadow-xl border border-slate-100 overflow-hidden">
        <!-- Header -->
        <div class="bg-indigo-900 p-6 text-white text-center">
            <h1 class="text-2xl font-bold flex items-center justify-center gap-2">
                <i data-lucide="calculator" class="w-7 h-7 text-indigo-400"></i> Kalkulator Lembur Karyawan
            </h1>
            <p class="text-indigo-200 text-sm mt-1">Berdasarkan Aturan PP No. 35 Tahun 2021 (UU Cipta Kerja)</p>
        </div>

        <!-- Form Input -->
        <div class="p-6 space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Input Gaji -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Gaji Bulanan (Pokok + Tunjangan Tetap)</label>
                    <div class="relative rounded-lg shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400 font-medium">Rp</div>
                        <input type="number" id="gaji" value="5000000" class="w-full pl-10 pr-3 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium">
                    </div>
                </div>

                <!-- Jenis Hari -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Jenis Hari Lembur</label>
                    <select id="jenisHari" class="w-full px-3 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white font-medium">
                        <option value="kerja">Hari Kerja Biasa</option>
                        <option value="libur">Hari Libur / Istirahat Mingguan</option>
                    </select>
                </div>
            </div>

            <!-- Durasi Lembur -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Durasi Lembur (Jam)</label>
                <div class="flex items-center gap-3">
                    <input type="range" id="jamLemburSlider" min="1" max="24" value="3" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-indigo-600">
                    <span id="displayJam" class="bg-indigo-50 text-indigo-700 px-4 py-1.5 rounded-lg font-bold text-lg border border-indigo-100 min-w-[70px] text-center">3 Jam</span>
                </div>
            </div>

            <button onclick="hitungLembur()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg shadow-md transition flex items-center justify-center gap-2">
                <i data-lucide="refresh-cw" class="w-5 h-5"></i> Hitung Upah Lembur
            </button>

            <hr class="border-slate-100">

            <!-- Hasil Perhitungan -->
            <div id="hasilBox" class="bg-slate-50 p-5 rounded-xl border border-slate-100 space-y-3">
                <h3 class="text-sm font-bold uppercase tracking-wider text-slate-400 mb-2">Rincian Hasil Perhitungan</h3>
                
                <div class="flex justify-between items-center text-sm">
                    <span class="text-slate-500">Upah per Jam (Gaji / 173)</span>
                    <span class="font-semibold text-slate-700" id="upahPerJam">Rp 28.902</span>
                </div>
                <div class="flex justify-between items-center text-sm">
                    <span class="text-slate-500">Konversi Total Jam Lembur</span>
                    <span class="font-semibold text-slate-700" id="konversiJam">5.5 Jam Upah</span>
                </div>
                
                <div class="pt-3 border-t border-dashed border-slate-200 flex justify-between items-center">
                    <span class="font-bold text-slate-800 text-base">Total Upah Lembur</span>
                    <span class="font-extrabold text-2xl text-green-600" id="totalUangLembur">Rp 158.959</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Script Logika Matematika Lembur -->
    <script>
        lucide.createIcons();

        const slider = document.getElementById('jamLemburSlider');
        const displayJam = document.getElementById('displayJam');

        // Update teks real-time saat slider digeser
        slider.addEventListener('input', function() {
            displayJam.innerText = this.value + " Jam";
            hitungLembur(); // Hitung otomatis setiap digeser
        });

        function formatRupiah(angka) {
            return "Rp " + Math.round(angka).toLocaleString('id-ID');
        }

        function hitungLembur() {
            const gaji = parseFloat(document.getElementById('gaji').value) || 0;
            const jenisHari = document.getElementById('jenisHari').value;
            const jamLembur = parseInt(slider.value);

            // 1. Hitung upah per jam dasar hukum Indonesia
            const upahPerJam = gaji / 173;
            
            let jamKonversi = 0;

            // 2. Hitung Jam Konversi berdasarkan aturan berlapis
            if (jenisHari === 'kerja') {
                // Hari Kerja: Jam pertama x1.5, jam berikutnya x2
                if (jamLembur >= 1) {
                    jamKonversi += 1.5; // Jam pertama
                }
                if (jamLembur > 1) {
                    jamKonversi += (jamLembur - 1) * 2; // Jam kedua dst
                }
            } else {
                // Hari Libur (Skema Umum 5 hari kerja): 8 jam pertama x2, jam ke-9 x3, jam ke-10 dst x4
                for (let i = 1; i <= jamLembur; i++) {
                    if (i <= 8) {
                        jamKonversi += 2;
                    } else if (i === 9) {
                        jamKonversi += 3;
                    } else {
                        jamKonversi += 4;
                    }
                }
            }

            // 3. Kalkulasi Total Uang
            const totalUang = upahPerJam * jamKonversi;

            // 4. Tampilkan ke UI
            document.getElementById('upahPerJam').innerText = formatRupiah(upahPerJam);
            document.getElementById('konversiJam').innerText = jamKonversi + " Jam Upah";
            document.getElementById('totalUangLembur').innerText = formatRupiah(totalUang);
        }

        // Jalankan fungsi hitung sekali di awal agar tidak kosong
        hitungLembur();
    </script>
</body>
</html>
